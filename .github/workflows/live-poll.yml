name: Live Poll

on:
  schedule:
    # A4 (checklist-noted): GitHub Actions schedule drift is accepted —
    # the actual interval may run somewhat later than every 10 minutes
    # under GH's own scheduler load.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger live-poll cron endpoint
        run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" ${{ vars.APP_URL }}/api/cron/live-poll
