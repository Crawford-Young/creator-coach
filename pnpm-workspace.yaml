# fast-uri: transitive via ajv;
# GHSA-v2hh-gcrm-f6hx / GHSA-7p8r-x3mc-p8w7 / GHSA-4c8g-83qw-93j6 / GHSA-5jgf-p345-68v8 / GHSA-f65p-4m7j-42xc / GHSA-fph4-wmhf-6fwf / GHSA-jqff-g426-hqxp / GHSA-qw65-cvwx-89v3 patched at
# 3.1.7. Exact pin inside ajv's ^3 range (4.x would exceed it). Drop when the
# ajv chains floor it.
#
# cmdk (peer of @crawfordyoung/ui, in the client bundle): held at the Radix
# versions main already ships. Any real bump makes pnpm re-resolve cmdk's
# ranges to dialog 1.3.1 / primitive 2.2.0, which changes rendered UI code.
# Drop both pins together with the held @crawfordyoung/ui bump.
overrides:
  fast-uri: 3.1.7
  'cmdk>@radix-ui/react-dialog': 1.1.23
  'cmdk>@radix-ui/react-primitive': 2.1.10

allowBuilds:
  esbuild: true
  mongodb-memory-server: true
  msw: true
  sharp: true
  unrs-resolver: true
